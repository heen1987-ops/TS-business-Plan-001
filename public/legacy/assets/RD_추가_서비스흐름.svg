<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img"><title>첨단연구개발처의 과업 수행 흐름</title><desc>사건과 근거를 바탕으로 확인계획을 세우고 허용된 수행, 전문 판단, 결과 대사, 재계획을 연결한다.</desc><rect width="1160" height="600" fill="#f3f6fa"/><text x="38" y="46" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#182e58">첨단연구개발처 · 목표에서 결과 확인까지</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#11776f"/></marker></defs><rect x="40" y="95" width="330" height="125" rx="10" fill="white" stroke="#91a9c1"/><text x="60" y="138" font-size="23" fill="#182e58" font-family="Malgun Gothic,sans-serif">사건·근거</text><text x="60" y="180" font-size="18" fill="#52667e" font-family="Malgun Gothic,sans-serif">대상 / 판본 / 유효기준</text><rect x="415" y="95" width="330" height="125" rx="10" fill="white" stroke="#91a9c1"/><text x="435" y="138" font-size="23" fill="#182e58" font-family="Malgun Gothic,sans-serif">NOA 확인계획</text><text x="435" y="180" font-size="18" fill="#52667e" font-family="Malgun Gothic,sans-serif">질문 / 자료 / 완료조건</text><rect x="790" y="95" width="330" height="125" rx="10" fill="white" stroke="#91a9c1"/><text x="810" y="138" font-size="23" fill="#182e58" font-family="Malgun Gothic,sans-serif">허용된 수행</text><text x="810" y="180" font-size="18" fill="#52667e" font-family="Malgun Gothic,sans-serif">조회 / 분석 / 오류 구분</text><rect x="40" y="315" width="330" height="125" rx="10" fill="white" stroke="#91a9c1"/><text x="60" y="358" font-size="23" fill="#182e58" font-family="Malgun Gothic,sans-serif">전문·공식 판단</text><text x="60" y="400" font-size="18" fill="#52667e" font-family="Malgun Gothic,sans-serif">현장 / 검토 / 공식 결과</text><rect x="415" y="315" width="330" height="125" rx="10" fill="white" stroke="#91a9c1"/><text x="435" y="358" font-size="23" fill="#182e58" font-family="Malgun Gothic,sans-serif">결과 대사</text><text x="435" y="400" font-size="18" fill="#52667e" font-family="Malgun Gothic,sans-serif">미해결 / 정정 / 인계</text><rect x="790" y="315" width="330" height="125" rx="10" fill="white" stroke="#91a9c1"/><text x="810" y="358" font-size="23" fill="#182e58" font-family="Malgun Gothic,sans-serif">새 근거 → 재계획</text><text x="810" y="400" font-size="18" fill="#52667e" font-family="Malgun Gothic,sans-serif">영향범위 / 재승인</text><path d="M370,158 L413,158" stroke="#11776f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M745,158 L788,158" stroke="#11776f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M955,220 L955,260" stroke="#11776f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M955,260 L205,260" stroke="#11776f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M205,260 L205,313" stroke="#11776f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M370,377 L413,377" stroke="#11776f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M745,377 L788,377" stroke="#11776f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="530" font-family="Malgun Gothic,sans-serif" font-size="20" fill="#182e58">기존 서버 · 로컬 LLM · CCK 주관 · 신규 인프라 구매 0원</text><text x="40" y="566" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#52667e">AI는 검증과업을 구성·수행한다. 전문시험·정비·공식 판정은 책임 주체가 수행한다.</text></svg>
