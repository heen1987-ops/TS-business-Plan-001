<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img"><title>NOA·aRDa·ERP 조직업무 연결</title><desc>처별 사건공간이 근거, 업무수행, 공식 자원원장과 연결된다. 기획·평가·협약·정산·성과는 독립 업무이며 조건을 확인해 결과를 인계한다.</desc><rect width="1200" height="890" fill="#f3f6fa"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#11776f"/></marker></defs><text x="35" y="48" font-family="Malgun Gothic,sans-serif" font-size="30" fill="#182e58">TS-AI 조직운영 · 근거에서 실제 결과까지</text><rect x="35" y="85" width="1130" height="112" rx="10" fill="white" stroke="#9bb0c6"/><text x="57" y="123" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#182e58">처별 업무공간 / 사업 ID 아래 여러 독립 업무 ID</text><text x="57" y="160" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">목적 · 담당 · 근거 · 완료조건 · 선택 제출본 · 전문판단 · 후속조치</text><rect x="35" y="245" width="345" height="193" rx="10" fill="white" stroke="#9bb0c6"/><text x="57" y="283" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#182e58">aRDa · 조직지식</text><text x="57" y="320" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">원문 · 판본 · 이용권리</text><text x="57" y="350" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">허용된 근거 제공</text><text x="57" y="380" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">검수된 지식 · 정정이력</text><rect x="428" y="245" width="345" height="193" rx="10" fill="white" stroke="#9bb0c6"/><text x="450" y="283" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#182e58">NOA · 과업수행</text><text x="450" y="320" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">상황 이해 → 계획 → 도구</text><text x="450" y="350" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">결과 검증 → 필요 시 재계획</text><text x="450" y="380" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">수행·승인·결과의 이력</text><rect x="820" y="245" width="345" height="193" rx="10" fill="white" stroke="#9bb0c6"/><text x="842" y="283" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#182e58">ERP · 공식 자원원장</text><text x="842" y="320" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">예산 · 거래 · 기준정보</text><text x="842" y="350" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">허용 조회 / 승인된 초안</text><text x="842" y="380" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">원장 상태 · 실제 반영 결과</text><path d="M600,197 L600,241" fill="none" stroke="#11776f" stroke-width="3" marker-end="url(#a)"/><path d="M380,340 L424,340" fill="none" stroke="#11776f" stroke-width="3" marker-end="url(#a)"/><path d="M773,340 L816,340" fill="none" stroke="#11776f" stroke-width="3" marker-end="url(#a)"/><path d="M600,438 L600,480" fill="none" stroke="#11776f" stroke-width="3" marker-end="url(#a)"/><text x="35" y="505" font-family="Malgun Gothic,sans-serif" font-size="23" fill="#182e58">연결되는 업무 · 각각 독립 상태와 승인조건</text><rect x="35" y="535" width="202" height="112" rx="10" fill="white" stroke="#9bb0c6"/><text x="57" y="573" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#182e58">B01 기획</text><text x="57" y="610" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">S5 기획·보고</text><rect x="267" y="535" width="202" height="112" rx="10" fill="white" stroke="#9bb0c6"/><text x="289" y="573" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#182e58">B02 평가</text><text x="289" y="610" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">S1 과제관리</text><rect x="499" y="535" width="202" height="112" rx="10" fill="white" stroke="#9bb0c6"/><text x="521" y="573" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#182e58">B03 협약</text><text x="521" y="610" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">S1 과제관리</text><rect x="731" y="535" width="202" height="112" rx="10" fill="white" stroke="#9bb0c6"/><text x="753" y="573" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#182e58">B04 정산</text><text x="753" y="610" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">S2 예산·정산</text><rect x="963" y="535" width="202" height="112" rx="10" fill="white" stroke="#9bb0c6"/><text x="985" y="573" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#182e58">B05 성과</text><text x="985" y="610" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">S3 성과관리</text><rect x="35" y="690" width="1130" height="148" rx="10" fill="white" stroke="#9bb0c6"/><text x="57" y="728" font-family="Malgun Gothic,sans-serif" font-size="24" fill="#182e58">조건부 인계와 변경 대응</text><text x="57" y="765" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">근거·판본·수신권한을 확인해 인계 / 변경된 목표·협약·실적의 영향만 재검토</text><text x="57" y="795" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">업무 승인 ≠ ERP 반영 ≠ 업무 완료 ≠ 조직지식 승격</text><text x="57" y="825" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#4c627b">기존 서버 · 로컬 LLM · 원문·계측은 원형 보존 · 물리 제어·공식 판정은 책임 주체</text></svg>