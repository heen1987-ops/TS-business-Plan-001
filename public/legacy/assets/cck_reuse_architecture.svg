<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">TS 업무공간과 CCK 재사용 후보 연결 설계</title><desc id="desc">처별 목표와 업무를 공통 계획 실행 체계로 연결하는 제안 구조. 제품 간 실제 설치 연결은 미확인이다. 공통 엔진은 한 번 검증하고 업무별 조건과 도구를 추가한다.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#41688c"/></marker></defs><rect width="1200" height="790" rx="18" fill="#f2f6fa"/><g font-family="Malgun Gothic, sans-serif" fill="#183248"><text x="40" y="48" font-size="26" font-weight="700">국민 편익 → 처별 목표 → 계획·실행·검증</text><text x="40" y="78" font-size="16">기획 아키텍처 · 제품의 실제 설치 연결/성능을 확인한 도식이 아님</text><rect x="40" y="108" width="1120" height="83" rx="12" fill="white" stroke="#b9cbdc"/><text x="58" y="143" font-size="18" font-weight="700">처별 NOA 업무공간 — 재사용 후보</text><text x="58" y="173" font-size="14">8개 처의 사건·목표·근거·계획·사람의 결정·후속결과 / 개인 초안과 조직 제출본 분리</text><rect x="40" y="239" width="730" height="102" rx="12" fill="white" stroke="#b9cbdc"/><text x="58" y="274" font-size="18" font-weight="700">Argus — 목표 기반 계획 / 도구 선택 / 재계획 후보</text><text x="58" y="304" font-size="14">TS 추가 설정: 완료조건 · 법정 기준 · 예외 · 허용 행동 · 중단 조건</text><rect x="40" y="389" width="730" height="102" rx="12" fill="white" stroke="#b9cbdc"/><text x="58" y="424" font-size="18" font-weight="700">Keeper — 과업 실행 / 상태 / 이력 후보</text><text x="58" y="454" font-size="14">TS 차이 검증: 업무 키 중복방지 · 결과 unknown 대사 · 재개/취소</text><rect x="40" y="539" width="350" height="110" rx="12" fill="white" stroke="#b9cbdc"/><text x="58" y="574" font-size="18" font-weight="700">Nexus → 기존 로컬 LLM</text><text x="58" y="604" font-size="14">provider / JSON / 토큰 / 부하 확인</text><rect x="420" y="539" width="350" height="110" rx="12" fill="white" stroke="#b9cbdc"/><text x="438" y="574" font-size="18" font-weight="700">기존 TS 시스템 · 업무도구</text><text x="438" y="604" font-size="14">허용 API로 조회·등록 / 공식 결과 대사</text><rect x="800" y="239" width="360" height="172" rx="12" fill="white" stroke="#b9cbdc"/><text x="818" y="274" font-size="18" font-weight="700">근거·지식 경계</text><text x="818" y="304" font-size="14">aRDa/기존 검색 · 판본 · 출처 · 정정</text><rect x="800" y="459" width="360" height="190" rx="12" fill="white" stroke="#b9cbdc"/><text x="818" y="494" font-size="18" font-weight="700">권한·승인 경계</text><text x="818" y="524" font-size="14">Mothership/NOA 후보 + TS 사건 권한</text><g stroke="#41688c" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"><path d="M400 192V231"/><path d="M400 342V381"/><path d="M215 492V531"/><path d="M590 492V531"/><path d="M795 290H776"/><path d="M795 549H777"/></g><text x="40" y="704" font-size="19" font-weight="700"> 공통 기반 1회 검증·계상 + 처별 기준·지식·도구·평가 증분</text><text x="40" y="739" font-size="16"> 기존 서버 사용 / 신규 인프라 구매 0원 / 로컬 LLM / 공식 승인·안전판단은 권한자 수행</text><text x="40" y="766" font-size="14"> 점선은 제안 연계 · 외부 LLM 우회, 비전, 자동 예산집행을 전제로 하지 않음</text></g></svg>