<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" role="img" aria-labelledby="t d"><title id="t">NOA를 처별 조직운영 워크스페이스로 확장</title><desc id="d">위에서 아래로 읽는 설계안. 모든 노드는 아래 표에서 텍스트로 설명한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#59778b"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fb"/><text x="30" y="40" font-size="23" fill="#14334c" font-family="Malgun Gothic, sans-serif">NOA를 처별 조직운영 워크스페이스로 확장</text><rect x="30.0" y="65" width="491.0" height="87" rx="10" fill="white" stroke="#9bb0c3"/><text x="46.0" y="95" font-size="18" font-weight="bold" fill="#14334c" font-family="Malgun Gothic, sans-serif">8개 처 워크스페이스</text><text x="46.0" y="119" font-size="14" fill="#365569" font-family="Malgun Gothic, sans-serif">같은 기반 위에 목적·화면·업무규칙 구성</text><rect x="539.0" y="65" width="491.0" height="87" rx="10" fill="white" stroke="#9bb0c3"/><text x="555.0" y="95" font-size="18" font-weight="bold" fill="#14334c" font-family="Malgun Gothic, sans-serif">기관·국민의 결과</text><text x="555.0" y="119" font-size="14" fill="#365569" font-family="Malgun Gothic, sans-serif">안전·접근성·절차완료·권익을 검증</text><line x1="530" y1="154" x2="530" y2="185" stroke="#59778b" stroke-width="2" marker-end="url(#a)"/><rect x="30.0" y="191" width="491.0" height="87" rx="10" fill="white" stroke="#9bb0c3"/><text x="46.0" y="221" font-size="18" font-weight="bold" fill="#14334c" font-family="Malgun Gothic, sans-serif">NOA 공통 Agent 기반</text><text x="46.0" y="245" font-size="14" fill="#365569" font-family="Malgun Gothic, sans-serif">목표 → 계획 → 실행 → 검증 → 재계획</text><rect x="539.0" y="191" width="491.0" height="87" rx="10" fill="white" stroke="#9bb0c3"/><text x="555.0" y="221" font-size="18" font-weight="bold" fill="#14334c" font-family="Malgun Gothic, sans-serif">권한·승인·실행 통제</text><text x="555.0" y="245" font-size="14" fill="#365569" font-family="Malgun Gothic, sans-serif">판본·전제조건·중복·결과 불명 관리</text><line x1="530" y1="280" x2="530" y2="311" stroke="#59778b" stroke-width="2" marker-end="url(#a)"/><rect x="30.0" y="317" width="491.0" height="87" rx="10" fill="white" stroke="#9bb0c3"/><text x="46.0" y="347" font-size="18" font-weight="bold" fill="#14334c" font-family="Malgun Gothic, sans-serif">aRDa 문서·지식</text><text x="46.0" y="371" font-size="14" fill="#365569" font-family="Malgun Gothic, sans-serif">출처·권한·판본·근거 위치</text><rect x="539.0" y="317" width="491.0" height="87" rx="10" fill="white" stroke="#9bb0c3"/><text x="555.0" y="347" font-size="18" font-weight="bold" fill="#14334c" font-family="Malgun Gothic, sans-serif">업무 Skill / 규칙도구</text><text x="555.0" y="371" font-size="14" fill="#365569" font-family="Malgun Gothic, sans-serif">처별 해석·계획 + 검증된 계산</text><line x1="530" y1="406" x2="530" y2="437" stroke="#59778b" stroke-width="2" marker-end="url(#a)"/><rect x="30.0" y="443" width="491.0" height="87" rx="10" fill="white" stroke="#9bb0c3"/><text x="46.0" y="473" font-size="18" font-weight="bold" fill="#14334c" font-family="Malgun Gothic, sans-serif">기존 업무시스템</text><text x="46.0" y="497" font-size="14" fill="#365569" font-family="Malgun Gothic, sans-serif">공식 상태·판정·접수·인계 기록</text><rect x="539.0" y="443" width="491.0" height="87" rx="10" fill="white" stroke="#9bb0c3"/><text x="555.0" y="473" font-size="18" font-weight="bold" fill="#14334c" font-family="Malgun Gothic, sans-serif">ERP 선택 어댑터</text><text x="555.0" y="497" font-size="14" fill="#365569" font-family="Malgun Gothic, sans-serif">전표 초안 등록·실제 결과 대사</text><line x1="530" y1="532" x2="530" y2="563" stroke="#59778b" stroke-width="2" marker-end="url(#a)"/><rect x="30.0" y="569" width="491.0" height="87" rx="10" fill="white" stroke="#9bb0c3"/><text x="46.0" y="599" font-size="18" font-weight="bold" fill="#14334c" font-family="Malgun Gothic, sans-serif">기존 로컬 서버·LLM</text><text x="46.0" y="623" font-size="14" fill="#365569" font-family="Malgun Gothic, sans-serif">신규 인프라 구매 0원 / 용량 검증 필요</text><rect x="539.0" y="569" width="491.0" height="87" rx=