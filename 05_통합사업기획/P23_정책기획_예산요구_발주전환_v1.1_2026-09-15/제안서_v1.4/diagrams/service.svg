<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title"><title id="title">서비스 흐름도</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#326b72"/></marker></defs><style>text{font-family:'Malgun Gothic','맑은 고딕',sans-serif;fill:#173e4c;font-size:17px} .title{font-size:20px;font-weight:700}.small{font-size:15px}.label{font-size:15px;fill:#46636b}.white{fill:white}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="40" y="30" class="title">역할별 확인과 인계  |  공식 상태와 내부 검토 상태를 구분</text><text x="42" y="95" class="title">업무담당자</text><rect x="275" y="65" width="420" height="90" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="293" y="95" class="title ">① 자료·의제 준비</text><text x="293" y="123" class="">허용 자료와 조사 범위</text><rect x="765" y="65" width="290" height="90" rx="8" fill="#e5f3ee" stroke="#499684" stroke-width="1.5" /><text x="783" y="95" class="title ">근거 묶음</text><path d="M695 110H757" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><path d="M480 155V172" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><text x="42" y="210" class="title">기획·현업 검토자</text><rect x="275" y="180" width="420" height="90" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="293" y="210" class="title ">② 문제·소관 검토</text><text x="293" y="238" class="">사실·가설·반대 근거 확인</text><rect x="765" y="180" width="290" height="90" rx="8" fill="#e5f3ee" stroke="#499684" stroke-width="1.5" /><text x="783" y="210" class="title ">문제 카드</text><path d="M695 225H757" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><path d="M480 270V287" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><text x="42" y="325" class="title">기획·현업 검토자</text><rect x="275" y="295" width="420" height="90" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="293" y="325" class="title ">③ 대안·사업 설계</text><text x="293" y="353" class="">선정 이유·범위·KPI 결정</text><rect x="765" y="295" width="290" height="90" rx="8" fill="#e5f3ee" stroke="#499684" stroke-width="1.5" /><text x="783" y="325" class="title ">사업안</text><path d="M695 340H757" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><path d="M480 385V402" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><text x="42" y="440" class="title">예산 검토자</text><rect x="275" y="410" width="420" height="90" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="293" y="440" class="title ">④ 산정·예산요구</text><text x="293" y="468" class="">공수·단가·경로·양식 검토</text><rect x="765" y="410" width="290" height="90" rx="8" fill="#e5f3ee" stroke="#499684" stroke-width="1.5" /><text x="783" y="440" class="title ">예산요구 초안</text><path d="M695 455H757" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><path d="M480 500V517" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><text x="42" y="555" class="title">공식 절차 담당자</text><rect x="275" y="525" width="420" height="90" rx="8" fill="#fcf1e4" stroke="#bc8953" stroke-width="1.5" /><text x="293" y="555" class="title ">⑤ 실제 처리결과 등록</text><text x="293" y="583" class="">확정 / 감액 / 보완 요구 확인</text><rect x="765" y="525" width="290" height="90" rx="8" fill="#fcf1e4" stroke="#bc8953" stroke-width="1.5" /><text x="783" y="555" class="title ">새 사업·비용 버전</text><path d="M695 570H757" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><path d="M480 615V632" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><text x="42" y="670" class="title">계약 검토자</text><rect x="275" y="640" width="420" height="90" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="293" y="670" class="title ">⑥ RFP·공고 인계</text><text x="293" y="698" class="">요구·검수·공개·계약조건 확인</text><rect x="765" y="640" width="290"