<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 960" role="img" aria-labelledby="title desc"><title id="title">사용자 흐름 · 부서 검토와 실제 결과 확인</title><desc id="desc">N0 → N1：문제 검토。N1 → N2：대안 검토。N2 → N3：비용 검토。N3 → N4：작성 요청。N4 → N5：검토。N5 → N6：외부 결과。N6 → N7：변경 영향。N7 → N8：인계</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8495"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}.title{font-size:22px;font-weight:700}.detail{font-size:18px;fill:#334d60}.edge{font-size:16px;fill:#435d70;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="52" font-size="28" font-weight="700" fill="#172e42">사용자 흐름 · 부서 검토와 실제 결과 확인</text><text x="40" y="88" font-size="18" fill="#587082">P23X-user · 제안 설계 · 운영 시스템 실측 전</text><polyline points="340,227.5 470,227.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="214.5" text-anchor="middle" class="edge"><tspan x="405" dy="0">문제 검토</tspan></text><polyline points="770,227.5 900,227.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="214.5" text-anchor="middle" class="edge"><tspan x="835" dy="0">대안 검토</tspan></text><polyline points="1050,310 1050,390" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1065" y="350" text-anchor="start" class="edge"><tspan x="1065" dy="0">비용 검토</tspan></text><polyline points="900,472.5 770,472.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="459.5" text-anchor="middle" class="edge"><tspan x="835" dy="0">작성 요청</tspan></text><polyline points="470,472.5 340,472.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="459.5" text-anchor="middle" class="edge"><tspan x="405" dy="0">검토</tspan></text><polyline points="190,555 190,635" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="205" y="595" text-anchor="start" class="edge"><tspan x="205" dy="0">외부 결과</tspan></text><polyline points="340,717.5 470,717.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="704.5" text-anchor="middle" class="edge"><tspan x="405" dy="0">변경 영향</tspan></text><polyline points="770,717.5 900,717.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="704.5" text-anchor="middle" class="edge"><tspan x="835" dy="0">인계</tspan></text><g data-node="N0"><rect x="40" y="145" width="300" height="165" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="58" y="176" class="title" fill="#946310"><tspan x="58" dy="0">업무 담당</tspan></text><text x="58" y="212" class="detail"><tspan x="58" dy="0">의제·자료·불편 등록</tspan></text></g><g data-node="N1"><rect x="470" y="145" width="300" height="165" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="488" y="176" class="title" fill="#946310"><tspan x="488" dy="0">기획 담당</tspan></text><text x="488" y="212" class="detail"><tspan x="488" dy="0">문제·대안·이견 정리</tspan></text></g><g data-node="N2"><rect x="900" y="145" width="300" height="165" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="918" y="176" class="title" fill="#946310"><tspan x="918" dy="0">정보화·업무 담당</tspan></text><text x="918" y="212" class="detail"><tspan x="918" dy="0">기존 기능·실행 검토</tspan></text></g><g data-node="N3"><rect x="900" y="390" width="300" height="165" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="918" y="421" class="title" fill="#946310"><tspan x="918" dy="0">예산 담당</tspan></text><text x="918" y="457" class="detail"><tspan x="918" dy="0">경로·산식·연차 확인</tspan></text></g><g data-node="N4"><rect x="470" y="390" width="300" height="165" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="488" y="421" class="title" fill="#087f72"><tspan x="488" dy="0">문서 작성 작업대</tspan></text><text x="488" y="457" class="detail"><tspan x="488" dy="0">양식별 초안·누락 안내</tspan></text></g><g data-node="N5"><rect x="40" y="390" width="300" height="165" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="58" y="421" class="title" fill="#946310"><tspan x="58" dy="0">부서 검토·회신</tspan></text><text x="58" y="457" class="detail"><tspan x="58" dy="0">오류는 보완·유보</tspan></text></g><g data-node="N6"><rect x="40" y="635" width="300" height="165" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="58" y="666" class="title" fill="#946310"><tspan x="58" dy="0">실제 심의 결과 등록</tspan></text><text x="58" y="702" class="detail"><tspan x="58" dy="0">승인·감액·유보 증빙</tspan></text></g><g data-node="N7"><rect x="470" y="635" width="300" height="165" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="488" y="666" class="title" fill="#946310"><tspan x="488" dy="0">범위·RFP 재검토</tspan></text><text x="488" y="702" class="detail"><tspan x="488" dy="0">감액 시 과업도 재확인</tspan></text></g><g data-node="N8"><rect x="900" y="635" width="300" height="165" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="918" y="666" class="title" fill="#946310"><tspan x="918" dy="0">계약 담당 인계</tspan></text><text x="918" y="702" class="detail"><tspan x="918" dy="0">공개본·미확정 조건</tspan></text></g><text x="40" y="875" font-size="17" fill="#425b6c">각 단계에서 보완·유보·종결 가능. 단계 이동만으로 공식 승인 상태를 만들지 않음</text><text x="40" y="902" font-size="17" fill="#425b6c">권한 없음·자료 부족·출력 실패는 사유와 보존된 입력·재시도 경로를 표시</text></svg>