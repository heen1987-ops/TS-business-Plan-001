<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 960" role="img" aria-labelledby="title desc"><title id="title">컨셉 · 자료에서 예산·발주 준비까지</title><desc id="desc">N0 → N1：정리。N1 → N2：비교。N2 → N3：구체화。N3 → N4：확인。N4 → N5：작성。N5 → N6：실제 결과。N6 → N7：범위 재확인。N7 → N8：검토 인계</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8495"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}.title{font-size:22px;font-weight:700}.detail{font-size:18px;fill:#334d60}.edge{font-size:16px;fill:#435d70;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="52" font-size="28" font-weight="700" fill="#172e42">컨셉 · 자료에서 예산·발주 준비까지</text><text x="40" y="88" font-size="18" fill="#587082">P23X-concept · 제안 설계 · 운영 시스템 실측 전</text><polyline points="340,227.5 470,227.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="214.5" text-anchor="middle" class="edge"><tspan x="405" dy="0">정리</tspan></text><polyline points="770,227.5 900,227.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="214.5" text-anchor="middle" class="edge"><tspan x="835" dy="0">비교</tspan></text><polyline points="1050,310 1050,390" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1065" y="350" text-anchor="start" class="edge"><tspan x="1065" dy="0">구체화</tspan></text><polyline points="900,472.5 770,472.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="459.5" text-anchor="middle" class="edge"><tspan x="835" dy="0">확인</tspan></text><polyline points="470,472.5 340,472.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="459.5" text-anchor="middle" class="edge"><tspan x="405" dy="0">작성</tspan></text><polyline points