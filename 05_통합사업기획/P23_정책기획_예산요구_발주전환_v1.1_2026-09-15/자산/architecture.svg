"421" class="title" fill="#4166a0"><tspan x="488" dy="0">사업·근거 원장</tspan></text><text x="488" y="457" class="detail"><tspan x="488" dy="0">권한·ID·버전·참조</tspan></text></g><g data-node="N5"><rect x="40" y="390" width="300" height="165" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="58" y="421" class="title" fill="#087f72"><tspan x="58" dy="0">규칙·산술 검증</tspan></text><text x="58" y="457" class="detail"><tspan x="58" dy="0">단위·필수값·변경 영향</tspan></text></g><g data-node="N6"><rect x="40" y="635" width="300" height="165" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="58" y="666" class="title" fill="#087f72"><tspan x="58" dy="0">문서 출력 어댑터</tspan></text><text x="58" y="702" class="detail"><tspan x="58" dy="0">HTML/MD·고정 HWPX</tspan></text></g><g data-node="N7"><rect x="470" y="635" width="300" height="165" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="488" y="666" class="title" fill="#946310"><tspan x="488" dy="0">담당자 검토</tspan></text><text x="488" y="702" class="detail"><tspan x="488" dy="0">실제 렌더·공개 적합성</tspan></text></g><g data-node="N8"><rect x="900" y="635" width="300" height="165" rx="16" fill="#edf2fe" stroke="#4166a0" stroke-width="1.8"/><text x="918" y="666" class="title" fill="#4166a0"><tspan x="918" dy="0">인계 파일·감사기록</tspan></text><text x="918" y="702" class="detail"><tspan x="918" dy="0">검토 이력·근거 참조</tspan></text></g><text x="40" y="875" font-size="17" fill="#425b6c">화살표는 대표 처리 흐름. 권한·버전 검사는 전 단계에 적용</text><text x="40" y="902" font-size="17" fill="#425b6c">HWPX·NOA 연동과 서버 성능은 실증 전 / 새 장비 구매 수량을 뜻하지 않음</text></svg>