<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 960" role="img" aria-labelledby="title desc"><title id="title">전체 구성 · 기존 TS 로컬 운영환경</title><desc id="desc">N0 → N1：진입。N1 → N2：요청。N2 → N3：검색·생성。N3 → N4：저장。N4 → N5：검증。N5 → N6：양식 매핑。N6 → N7：초안。N7 → N8：검토 결과</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8495"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}.title{font-size:22px;font-weight:700}.detail{font-size:18px;fill:#334d60}.edge{font-size:16px;fill:#435d70;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="52" font-size="28" font-weight="700" fill="#172e42">전체 구성 · 기존 TS 로컬 운영환경</text><text x="40" y="88" font-size="18" fill="#587082">P23X-architecture · 제안 설계 · 운영 시스템 실측 전</text><polyline points="340,227.5 470,227.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="214.5" text-anchor="middle" class="edge"><tspan x="405" dy="0">진입</tspan></text><polyline points="770,227.5 900,227.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="214.5" text-anchor="middle" class="edge"><tspan x="835" dy="0">요청</tspan></text><polyline points="1050,310 1050,390" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1065" y="350" text-anchor="start" class="edge"><tspan x="1065" dy="0">검색·생성</tspan></text><polyline points="900,472.5 770,472.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="459.5" text-anchor="middle" class="edge"><tspan x="835" dy="0">저장</tspan></text><polyline points="470,472.5 340,472.5" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="459.5" text-anchor="middle" class="edge"><tspan x="405" dy="0">검증</tspan></text><polyline