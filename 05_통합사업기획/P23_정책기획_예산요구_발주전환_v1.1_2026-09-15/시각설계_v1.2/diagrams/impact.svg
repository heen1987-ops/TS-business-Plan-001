<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1090" role="group" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">06 변경·문서 추적</title><desc id="diagram-desc">한 가상 의제의 참조 관계다. 변경은 새 버전으로 기록하며 과거 검토본을 자동 덮어쓰지 않는다. 정적 도식 원본입니다. 상세 입출력은 HTML 설명페이지에서 확인합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66818d"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}.node-shape{fill:var(--fill);stroke:var(--stroke);stroke-width:2}.node{cursor:default}.node:focus{outline:none}.node.selected .node-shape,.node:focus .node-shape{stroke:#102f42;stroke-width:5}.node.scenario .node-shape{stroke-width:4}.node-sub{pointer-events:none}.node-title{pointer-events:none}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="48" fill="#173c50" font-size="26" font-weight="700">06 변경·문서 추적 · P23 제안 설계</text><text x="40" y="82" fill="#4d6978" font-size="19">원장과 근거가 바뀌면 어떤 문서를 다시 봐야 하는가?</text><g class="edge" data-from="V01" data-to="V02"><polyline points="420,235 530,235" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="475" y="223" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">원문 참조</text></g><g class="edge" data-from="V02" data-to="V03"><polyline points="910,235 1020,235" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="965" y="223" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">주장 근거</text></g><g class="edge" data-from="V03" data-to="V04"><polyline points="1210,300 1210,470" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="1223" y="378" text-anchor="start" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">사업화 검토</text></g><g class="edge" data-from="V04" data-to="V05"><polyline points="1020,547.5 910,547.5" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="965" y="445.5" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">범위·수량</text></g><g class="edge" data-from="V05" data-to="V06"><polyline points="530,547.5 420,547.5" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="475" y="535.5" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">금액 변경</text></g><g class="edge" data-from="V01" data-to="V06"><polyline points="230,300 230,470" stroke="#ae453c" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="243" y="378" text-anchor="start" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">철회·정정 이벤트</text></g><g class="edge" data-from="V06" data-to="V07"><polyline points="230,625 230,720 180,720 180,820" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="193" y="763" text-anchor="start" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">재검토</text></g><g class="edge" data-from="V06" data-to="V08"><polyline points="230,625 230,720 540,720 540,820" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="385" y="708" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">재검토</text></g><g class="edge" data-from="V06" data-to="V09"><polyline points="230,625 230,720 900,720 900,820" stroke="#66818d" stroke-width="2.4" fill=