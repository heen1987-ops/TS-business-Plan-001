<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1130" role="group" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">05 판단·예외 로직</title><desc id="diagram-desc">초안 생성과 다음 단계의 검토 준비를 분리한다. 유보·보완·타기관 협업 경로를 함께 표시한다. 정적 도식 원본입니다. 상세 입출력은 HTML 설명페이지에서 확인합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66818d"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}.node-shape{fill:var(--fill);stroke:var(--stroke);stroke-width:2}.node{cursor:default}.node:focus{outline:none}.node.selected .node-shape,.node:focus .node-shape{stroke:#102f42;stroke-width:5}.node.scenario .node-shape{stroke-width:4}.node-sub{pointer-events:none}.node-title{pointer-events:none}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="48" fill="#173c50" font-size="26" font-weight="700">05 판단·예외 로직 · P23 제안 설계</text><text x="40" y="82" fill="#4d6978" font-size="19">근거가 부족하거나 예산이 바뀌면 어디로 돌아가는가?</text><g class="edge" data-from="L00" data-to="L01"><polyline points="295,240 455,240" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="375" y="228" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">검토</text></g><g class="edge" data-from="L01" data-to="L02"><polyline points="740,240 1025,240" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="882.5" y="228" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">확인됨</text></g><g class="edge" data-from="L01" data-to="L11"><polyline points="597.5,330 597.5,377.5 600,377.5 600,425" stroke="#ae453c" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="599.625" y="365.5" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">부족·상충</text></g><g class="edge" data-from="L11" data-to="L01"><polyline points="440,490 395,490 395,240 455,240" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="408" y="372" text-anchor="start" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">재검토</text></g><g class="edge" data-from="L02" data-to="L12"><polyline points="1190,330 1190,377.5 1195,377.5 1195,425" stroke="#ae453c" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="1194.25" y="365.5" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">미확인·중복</text></g><g class="edge" data-from="L02" data-to="L03"><polyline points="1355,240 1415,240 1415,755 1355,755" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="1395" y="605" text-anchor="end" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">확인 후 예산 검토</text></g><g class="edge" data-from="L03" data-to="L04"><polyline points="1025,755 785,755" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="905" y="743" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">실제 결과 반영</text></g><g class="edge" data-from="L03" data-to="L13"><polyline points="1190,845 1190,905 1195,905 1195,965" stroke="#ae453c" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="1194.25" y="893" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">미확인·감액 미반영</text></g><g class="edge" data-from="L13" data-to="L03"><polyline points=