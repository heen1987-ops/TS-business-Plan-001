<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1030" role="group" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">01 컨셉도</title><desc id="diagram-desc">허용된 자료를 검토 가능한 근거로 만들고, 정책·예산·발주 문서에 연결한다. 정적 도식 원본입니다. 상세 입출력은 HTML 설명페이지에서 확인합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66818d"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}.node-shape{fill:var(--fill);stroke:var(--stroke);stroke-width:2}.node{cursor:default}.node:focus{outline:none}.node.selected .node-shape,.node:focus .node-shape{stroke:#102f42;stroke-width:5}.node.scenario .node-shape{stroke-width:4}.node-sub{pointer-events:none}.node-title{pointer-events:none}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="48" fill="#173c50" font-size="26" font-weight="700">01 컨셉도 · P23 제안 설계</text><text x="40" y="82" fill="#4d6978" font-size="19">이 서비스는 누구의 어떤 일을 돕는가?</text><g class="group"><rect x="440" y="245" width="490" height="360" rx="15" fill="#f5f8fa" stroke="#c9d8de" stroke-dasharray="8 5"/><text x="458" y="276" font-size="20" fill="#355366">기존 로컬 서버 · NOA + LLM + 업무 규칙</text></g><g class="edge" data-from="C01" data-to="C04"><polyline points="330,230 380,230 380,440 470,440" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="393.5" y="428" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">허용 자료</text></g><g class="edge" data-from="C02" data-to="C04"><polyline points="330,455 400,455 400,440 470,440" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="389.5" y="485" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">업무 맥락</text></g><g class="edge" data-from="C03" data-to="C04"><polyline points="330,680 415,680 415,440 470,440" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="402" y="567" text-anchor="end" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">검토 목표</text></g><g class="edge" data-from="C04" data-to="C05"><polyline points="900,440 975,440 975,230 1060,230" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="987.75" y="218" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">문제·근거</text></g><g class="edge" data-from="C04" data-to="C06"><polyline points="900,440 980,440 980,455 1060,455" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="968" y="428" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">사업·비용</text></g><g class="edge" data-from="C04" data-to="C07"><polyline points="900,440 1010,440 1010,680 1060,680" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="1023" y="567" text-anchor="start" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">범위·요구</text></g><g class="edge" data-from="C04" data-to="C08"><polyline points="685,545 685,800" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="698" y="665.5" text-anchor="start" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">초안·미확인 사항</text></g><g class="node node-external" role="group" data-node="C01" aria-label="정책·통계·국민 의견" style="--stroke:#526675;--fill:#f0f3f6"><g class="node-shape"><rect x="45" y="160" width="285" height="140" rx="5"/></g><text class="node-title" x="65" y="220.5" font-size="23" font-weight="700" fill="#526675"><tspan x="65" dy="0">정책·통계·국민 의견</tspan></text><text class="node-sub" x="65" y="255.5" font-size="18" fill="#365264"><tspan x="65" dy="0">문제의 규모·맥락·원출처</tspan></text></g><g class="node node-external" role="group" data-node="C02" aria-label="TS 업무·기존 사업" style="--stroke:#526675;--fill:#f0f3f6"><g class="node-shape"><rect x="45" y="385" width="285" height="140" rx="5"/></g><text class="node-title" x="65" y="445.5" font-size="23" font-weight="700" fill="#526675"><tspan x="65" dy="0">TS 업무·기존 사업</tspan></text><text class="node-sub" x="65" y="480.5" font-size="18" fill="#365264"><tspan x="65" dy="0">소관·현황·계약·성과</tspan></text></g><g class="node node-external" role="group" data-node="C03" aria-label="담당자의 조사 질문" style="--stroke:#526675;--fill:#f0f3f6"><g class="node-shape"><rect x="45" y="610" width="285" height="140" rx="5"/></g><text class="node-title" x="65" y="670.5" font-size="23" font-weight="700" fill="#526675"><tspan x="65" dy="0">담당자의 조사 질문</tspan></text><text class="node-sub" x="65" y="705.5" font-size="18" fill="#365264"><tspan x="65" dy="0">대상·기간·불편·위험</tspan></text></g><g class="node node-ai" role="group" data-node="C04" aria-label="NOA 정책기획 작업대" style="--stroke:#067266;--fill:#e3f4ef"><g class="node-shape"><rect x="470" y="335" width="430" height="210" rx="18"/></g><text class="node-title" x="490" y="430.5" font-size="23" font-weight="700" fill="#067266"><tspan x="490" dy="0">NOA 정책기획 작업대</tspan></text><text class="node-sub" x="490" y="465.5" font-size="18" fill="#365264"><tspan x="490" dy="0">근거·문제 → 대안·사업 → 예산·문서</tspan></text></g><g class="node node-ai" role="group" data-node="C05" aria-label="문제·정책 검토서" style="--stroke:#067266;--fill:#e3f4ef"><g class="node-shape"><rect x="1060" y="160" width="295" height="140" rx="18"/></g><text class="node-title" x="1080" y="220.5" font-size="23" font-weight="700" fill="#067266"><tspan x="1080" dy="0">문제·정책 검토서</tspan></text><text class="node-sub" x="1080" y="255.5" font-size="18" fill="#365264"><tspan x="1080" dy="0">F01 · 근거·가설·대안</tspan></text></g><g class="node node-rule" role="group" data-node="C06" aria-label="예산 요구·설명자료" style="--stroke:#485894;--fill:#edf0fc"><g class="node-shape"><rect x="1060" y="385" width="295" height="140" rx="18"/></g><text class="node-title" x="1080" y="445.5" font-size="23" font-weight="700" fill="#485894"><tspan x="1080" dy="0">예산 요구·설명자료</tspan></text><text class="node-sub" x="1080" y="480.5" font-size="18" fill="#365264"><tspan x="1080" dy="0">F02·F03·F06 · 산식·보완</tspan></text></g><g class="node node-ai" role="group" data-node="C07" aria-label="RFP·공고 준비자료" style="--stroke:#067266;--fill:#e3f4ef"><g class="node-shape"><rect x="1060" y="610" width="295" height="140" rx="18"/></g><text class="node-title" x="1080" y="658.5" font-size="23" font-weight="700" fill="#067266"><tspan x="1080" dy="0">RFP·공고 준비자료</tspan></text><text class="node-sub" x="1080" y="693.5" font-size="18" fill="#365264"><tspan x="1080" dy="0">F04·F05 · 요구·검수</tspan><tspan x="1080" dy="24">인계</tspan></text></g><g class="node node-human" role="group" data-node="C08" aria-label="담당자 검토와 공식 인계" style="--stroke:#875809;--fill:#fff1d6"><g class="node-shape"><rect x="470" y="800" width="430" height="140" rx="18"/></g><text class="node-title" x="490" y="860.5" font-size="23" font-weight="700" fill="#875809"><tspan x="490" dy="0">담당자 검토와 공식 인계</tspan></text><text class="node-sub" x="490" y="895.5" font-size="18" fill="#365264"><tspan x="490" dy="0">정책·예산·계약의 판단 사유를 보존</tspan></text></g></svg>