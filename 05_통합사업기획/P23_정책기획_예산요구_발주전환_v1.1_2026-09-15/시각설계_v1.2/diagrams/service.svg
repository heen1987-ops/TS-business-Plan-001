<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" role="group" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">02 서비스 흐름도</title><desc id="diagram-desc">행은 업무 단계, 열은 입력·시스템·담당자와 결과다. 1단계의 결과를 다음 단계에서 재사용한다. 정적 도식 원본입니다. 상세 입출력은 HTML 설명페이지에서 확인합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66818d"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}.node-shape{fill:var(--fill);stroke:var(--stroke);stroke-width:2}.node{cursor:default}.node:focus{outline:none}.node.selected .node-shape,.node:focus .node-shape{stroke:#102f42;stroke-width:5}.node.scenario .node-shape{stroke-width:4}.node-sub{pointer-events:none}.node-title{pointer-events:none}</style><rect width="100%" height="100%" fill="white"/><text x="40" y="48" fill="#173c50" font-size="26" font-weight="700">02 서비스 흐름도 · P23 제안 설계</text><text x="40" y="82" fill="#4d6978" font-size="19">입력한 자료가 어떤 검토를 거쳐 문서가 되는가?</text><g class="group"><rect x="40" y="100" width="380" height="50" rx="15" fill="#edf4f2" stroke="#c9d8de" stroke-dasharray="0"/><text x="58" y="131" font-size="20" fill="#355366">입력·등록</text></g><g class="group"><rect x="510" y="100" width="380" height="50" rx="15" fill="#edf4f2" stroke="#c9d8de" stroke-dasharray="0"/><text x="528" y="131" font-size="20" fill="#355366">NOA + 로컬 LLM / 규칙 처리</text></g><g class="group"><rect x="980" y="100" width="380" height="50" rx="15" fill="#edf4f2" stroke="#c9d8de" stroke-dasharray="0"/><text x="998" y="131" font-size="20" fill="#355366">담당자 검토·산출물</text></g><g class="edge" data-from="S01" data-to="S02"><polyline points="420,240 510,240" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="465" y="228" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">입력</text></g><g class="edge" data-from="S02" data-to="S03"><polyline points="890,240 980,240" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="935" y="228" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">초안</text></g><g class="edge" data-from="S04" data-to="S05"><polyline points="420,475 510,475" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="465" y="463" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">입력</text></g><g class="edge" data-from="S05" data-to="S06"><polyline points="890,475 980,475" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="935" y="463" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">초안</text></g><g class="edge" data-from="S07" data-to="S08"><polyline points="420,710 510,710" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="465" y="698" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">입력</text></g><g class="edge" data-from="S08" data-to="S09"><polyline points="890,710 980,710" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="935" y="698" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">초안</text></g><g class="edge" data-from="S10" data-to="S11"><polyline points="420,945 510,945" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="465" y="933" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">입력</text></g><g class="edge" data-from="S11" data-to="S12"><polyline points="890,945 980,945" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="935" y="933" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">초안</text></g><g class="edge" data-from="S03" data-to="S04"><polyline points="1170,305 1170,355 230,355 230,410" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="700" y="343" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">확인된 문제</text></g><g class="edge" data-from="S06" data-to="S07"><polyline points="1170,540 1170,590 230,590 230,645" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="700" y="578" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">검토된 범위</text></g><g class="edge" data-from="S09" data-to="S10"><polyline points="1170,775 1170,825 230,825 230,880" stroke="#66818d" stroke-width="2.4" fill="none" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="700" y="813" text-anchor="middle" font-size="18" fill="#36586a" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">실제 결과와 보완사항</text></g><g class="node node-external" role="group" data-node="S01" aria-label="01 자료·질문 등록" style="--stroke:#526675;--fill:#f0f3f6"><g class="node-shape"><rect x="40" y="175" width="380" height="130" rx="5"/></g><text class="node-title" x="60" y="230.5" font-size="23" font-weight="700" fill="#526675"><tspan x="60" dy="0">01 자료·질문 등록</tspan></text><text class="node-sub" x="60" y="265.5" font-size="18" fill="#365264"><tspan x="60" dy="0">정책 의제·허용 자료·검토 기간</tspan></text></g><g class="node node-ai" role="group" data-node="S02" aria-label="근거