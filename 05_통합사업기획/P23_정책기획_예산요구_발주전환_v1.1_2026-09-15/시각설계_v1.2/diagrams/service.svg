 rx="18"/></g><text class="node-title" x="1000" y="465.5" font-size="23" font-weight="700" fill="#875809"><tspan x="1000" dy="0">사업범위 검토 → 원장</tspan></text><text class="node-sub" x="1000" y="500.5" font-size="18" fill="#365264"><tspan x="1000" dy="0">기획·정보화: 범위·요구·성과</tspan></text></g><g class="node node-human" role="group" data-node="S07" aria-label="03 재원·연차·단가 입력" style="--stroke:#875809;--fill:#fff1d6"><g class="node-shape"><rect x="40" y="645" width="380" height="130" rx="18"/></g><text class="node-title" x="60" y="700.5" font-size="23" font-weight="700" fill="#875809"><tspan x="60" dy="0">03 재원·연차·단가 입력</tspan></text><text class="node-sub" x="60" y="735.5" font-size="18" fill="#365264"><tspan x="60" dy="0">미확인 금액은 미확인으로 유지</tspan></text></g><g class="node node-rule" role="group" data-node="S08" aria-label="비용 검증·예산문서 초안" style="--stroke:#485894;--fill:#edf0fc"><g class="node-shape"><rect x="510" y="645" width="380" height="130" rx="18"/></g><text class="node-title" x="530" y="700.5" font-size="23" font-weight="700" fill="#485894"><tspan x="530" dy="0">비용 검증·예산문서 초안</tspan></text><text class="node-sub" x="530" y="735.5" font-size="18" fill="#365264"><tspan x="530" dy="0">산식·증감·서식·질의 답변</tspan></text></g><g class="node node-human" role="group" data-node="S09" aria-label="예산 검토 → F02·F03·F06" style="--stroke:#875809;--fill:#fff1d6"><g class="node-shape"><rect x="980" y="645" width="380" height="130" rx="18"/></g><text class="node-title" x="1000" y="700.5" font-size="23" font-weight="700" fill="#875809"><tspan x="1000" dy="0">예산 검토 → F02·F03·F06</tspan></text><text class="node-sub" x="1000" y="735.5" font-size="18" fill="#365264"><tspan x="1000" dy="0">예산 담당: 요구·실제 결과 확인</tspan></text></g><g class="node node-human" role="group" data-node="S10" aria-label="04 실제 결과·범위 재확인" style="--stroke:#875809;--fill:#fff1d6"><g class="node-shape"><rect x="40" y="880" width="380" height="130" rx="18"/></g><text class="node-title" x="60" y="935.5" font-size="23" font-weight="700"