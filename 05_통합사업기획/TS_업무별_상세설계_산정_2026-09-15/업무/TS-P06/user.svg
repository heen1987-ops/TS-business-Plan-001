<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1290" role="img" aria-labelledby="title desc"><title id="title">사용자 흐름 · 기본·대안·예외</title><desc id="desc">U1 → S1：목표·자료。S1 → O1：허용 범위 조회。O1 → S2：상태·자료。S2 → H1：후보·이유。H1 → E1：아니요 / 오류。E1 → U1：입력 보존·수정。H1 → H2：예 / 확인。H2 → O2：선택·승인。O2 → END：확인된 결과。E1 → E2：재확인 불가</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8495"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}.title{font-size:22px;font-weight:700}.detail{font-size:18px;fill:#334d60}.edge{font-size:16px;fill:#435d70;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="52" font-size="28" font-weight="700" fill="#172e42">사용자 흐름 · 기본·대안·예외</text><text x="40" y="88" font-size="18" fill="#587082">TS-P06-user · 제안 설계 · 운영 시스템 실측 전</text><polyline points="340,245 470,245" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="232" text-anchor="middle" class="edge"><tspan x="405" dy="0">목표·자료</tspan></text><polyline points="770,245 900,245" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="232" text-anchor="middle" class="edge"><tspan x="835" dy="0">허용 범위 조회</tspan></text><polyline points="1050,325 1050,425" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1065" y="375" text-anchor="start" class="edge"><tspan x="1065" dy="0">상태·자료</tspan></text><polyline points="900,505 770,505" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="492" text-anchor="middle" class="edge"><tspan x="835" dy="0">후보·이유</tspan></text><polyline points="470,505 340,505" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="492" text-anchor="middle" class="edge"><tspan x="405" dy="0">아니요 / 오류</tspan></text><polyline points="190,425 190,325" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="205" y="375" text-anchor="start" class="edge"><tspan x="205" dy="0">입력 보존·수정</tspan></text><polyline points="620,585 620,700" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="635" y="642.5" text-anchor="start" class="edge"><tspan x="635" dy="0">예 / 확인</tspan></text><polyline points="770,780 900,780" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="767" text-anchor="middle" class="edge"><tspan x="835" dy="0">선택·승인</tspan></text><polyline points="1050,860 1050,985" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1065" y="922.5" text-anchor="start" class="edge"><tspan x="1065" dy="0">확인된 결과</tspan></text><polyline points="190,585 190,700" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="205" y="642.5" text-anchor="start" class="edge"><tspan x="205" dy="0">재확인 불가</tspan></text><g data-node="U1"><rect x="40" y="165" width="300" height="160" rx="16" fill="#edf1f5" stroke="#61768b" stroke-width="1.8"/><text x="58" y="196" class="title" fill="#61768b"><tspan x="58" dy="0">01 진입·목표 설정</tspan></text><text x="58" y="232" class="detail"><tspan x="58" dy="0">철도 자율보고 분석자</tspan></text></g><g data-node="S1"><rect x="470" y="165" width="300" height="160" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="488" y="196" class="title" fill="#087f72"><tspan x="488" dy="0">02 조건·권한 확인</tspan></text><text x="488" y="232" class="detail"><tspan x="488" dy="0">접근 허용 보고·승인 사례</tspan></text></g><g data-node="O1"><rect x="900" y="165" width="300" height="160" rx="16" fill="#edf1f5" stroke="#61768b" stroke-width="1.8"/><text x="918" y="196" class="title" fill="#61768b"><tspan x="918" dy="0">03 원천 확인</tspan></text><text x="918" y="232" class="detail"><tspan x="918" dy="0">철도 자율보고 관리</tspan></text></g><g data-node="S2"><rect x="900" y="425" width="300" height="160" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="918" y="456" class="title" fill="#087f72"><tspan x="918" dy="0">04 초안·후보 표시</tspan></text><text x="918" y="492" class="detail"><tspan x="918" dy="0">검토본·전파 초안</tspan></text></g><g data-node="H1"><rect x="470" y="425" width="300" height="160" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="488" y="456" class="title" fill="#946310"><tspan x="488" dy="0">05 검토·선택</tspan></text><text x="488" y="492" class="detail"><tspan x="488" dy="0">보호·의미 검토를 통과?</tspan></text></g><g data-node="E1"><rect x="40" y="425" width="300" height="160" rx="16" fill="#fff0ee" stroke="#b74037" stroke-width="1.8"/><text x="58" y="456" class="title" fill="#b74037"><tspan x="58" dy="0">보완·재조회</tspan></text><text x="58" y="492" class="detail"><tspan x="58" dy="0">간접 식별 가능 → 전파 보류</tspan></text></g><g data-node="H2"><rect x="470" y="700" width="300" height="160" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="488" y="731" class="title" fill="#946310"><tspan x="488" dy="0">06 확정 요청</tspan></text><text x="488" y="767" class="detail"><tspan x="488" dy="0">담당자 승인 또는 공식 안내</tspan></text></g><g data-node="O2"><rect x="900" y="700" width="300" height="160" rx="16" fill="#edf1f5" stroke="#61768b" stroke-width="1.8"/><text x="918" y="731" class="title" fill="#61768b"><tspan x="918" dy="0">07 공식 결과 확인</tspan></text><text x="918" y="767" class="detail"><tspan x="918" dy="0">전문가 전파 승인</tspan></text></g><g data-node="END"><rect x="900" y="985" width="300" height="160" rx="16" fill="#edf2fe" stroke="#4166a0" stroke-width="1.8"/><text x="918" y="1016" class="title" fill="#4166a0"><tspan x="918" dy="0">08 종료·후속 경로</tspan></text><text x="918" y="1052" class="detail"><tspan x="918" dy="0">근거·상태·정정 방법 표시</tspan></text></g><g data-node="E2"><rect x="40" y="700" width="300" height="160" rx="16" fill="#fff0ee" stroke="#b74037" stroke-width="1.8"/><text x="58" y="731" class="title" fill="#b74037"><tspan x="58" dy="0">근거 부족·권한 없음</tspan></text><text x="58" y="767" class="detail"><tspan x="58" dy="0">확정 보류 / 기존 경로 제공</tspan></text></g><text x="40" y="1205" font-size="17" fill="#425b6c">도식의 05 단계가 사람의 검토 지점. 오류·미확인 상태를 성공으로 표시하지 않음</text><text x="40" y="1232" font-size="17" fill="#425b6c">로딩·빈 결과·권한 거부·오프라인·타임아웃의 화면 동작은 요구사항 페이지에 정의</text></svg>