<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1060" role="img" aria-labelledby="title desc"><title id="title">전체 논리 아키텍처 · 기존 TS 서버에서 구성</title><desc id="desc">U → UI：인증·입력。UI → SYS：공식 경로 확인。UI → NOA：요청·검토 맥락。ACL → NOA：검증된 요청。NOA → API：허용 도구 호출。API → SYS：권한 범위 연계。NOA → RAG：권한·질문。RAG → LLM：근거·규칙。LLM → ACL：초안 재검증。API → AUD：호출 상태。RAG → AUD：근거 참조</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8495"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}.title{font-size:22px;font-weight:700}.detail{font-size:18px;fill:#334d60}.edge{font-size:16px;fill:#435d70;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="52" font-size="28" font-weight="700" fill="#172e42">전체 논리 아키텍처 · 기존 TS 서버에서 구성</text><text x="40" y="88" font-size="18" fill="#587082">TS-P14-architecture · 제안 설계 · 운영 시스템 실측 전</text><polyline points="340,230 470,230" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="217" text-anchor="middle" class="edge"><tspan x="405" dy="0">인증·입력</tspan></text><polyline points="770,230 900,230" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="217" text-anchor="middle" class="edge"><tspan x="835" dy="0">공식 경로 확인</tspan></text><polyline points="620,310 620,405" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="635" y="357.5" text-anchor="start" class="edge"><tspan x="635" dy="0">요청·검토 맥락</tspan></text><polyline points="340,485 470,485" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="472" text-anchor="middle" class="edge"><tspan x="405" dy="0">검증된 요청</tspan></text><polyline points="770,485 900,485" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="472" text-anchor="middle" class="edge"><tspan x="835" dy="0">허용 도구 호출</tspan></text><polyline points="1050,405 1050,310" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1065" y="357.5" text-anchor="start" class="edge"><tspan x="1065" dy="0">권한 범위 연계</tspan></text><polyline points="620,565 620,670" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="635" y="617.5" text-anchor="start" class="edge"><tspan x="635" dy="0">권한·질문</tspan></text><polyline points="470,750 340,750" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="737" text-anchor="middle" class="edge"><tspan x="405" dy="0">근거·규칙</tspan></text><polyline points="190,670 190,565" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="205" y="617.5" text-anchor="start" class="edge"><tspan x="205" dy="0">초안 재검증</tspan></text><polyline points="1050,565 1050,670" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1065" y="617.5" text-anchor="start" class="edge"><tspan x="1065" dy="0">호출 상태</tspan></text><polyline points="770,750 900,750" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="737" text-anchor="middle" class="edge"><tspan x="835" dy="0">근거 참조</tspan></text><g data-node="U"><rect x="40" y="150" width="300" height="160" rx="16" fill="#edf1f5" stroke="#61768b" stroke-width="1.8"/><text x="58" y="181" class="title" fill="#61768b"><tspan x="58" dy="0">안전기준·문서 담당자</tspan></text><text x="58" y="217" class="detail"><tspan x="58" dy="0">역할·기관·업무 범위</tspan></text></g><g data-node="UI"><rect x="470" y="150" width="300" height="160" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="488" y="181" class="title" fill="#087f72"><tspan x="488" dy="0">업무 화면·검토 작업대</tspan></text><text x="488" y="217" class="detail"><tspan x="488" dy="0">영향 후보·반영 이력</tspan></text></g><g data-node="SYS"><rect x="900" y="150" width="300" height="160" rx="16" fill="#edf1f5" stroke="#61768b" stroke-width="1.8"/><text x="918" y="181" class="title" fill="#61768b"><tspan x="918" dy="0">기존 공식 업무 시스템</tspan></text><text x="918" y="217" class="detail"><tspan x="918" dy="0">기준·시험계획·발행 관리</tspan></text></g><g data-node="ACL"><rect x="40" y="405" width="300" height="160" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="58" y="436" class="title" fill="#087f72"><tspan x="58" dy="0">권한·입력·상태 검증</tspan></text><text x="58" y="472" class="detail"><tspan x="58" dy="0">허용 자료·도구 / 실패 구분</tspan></text></g><g data-node="NOA"><rect x="470" y="405" width="300" height="160" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="488" y="436" class="title" fill="#087f72"><tspan x="488" dy="0">NOA 업무 실행 구성</tspan></text><text x="488" y="472" class="detail"><tspan x="488" dy="0">관할·적용일 관리</tspan></text></g><g data-node="API"><rect x="900" y="405" width="300" height="160" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="918" y="436" class="title" fill="#087f72"><tspan x="918" dy="0">연계·승인된 자료 반입</tspan></text><text x="918" y="472" class="detail"><tspan x="918" dy="0">읽기·검토 자료만 사용</tspan></text></g><g data-node="LLM"><rect x="40" y="670" width="300" height="160" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="58" y="701" class="title" fill="#087f72"><tspan x="58" dy="0">기존 로컬 LLM</tspan></text><text x="58" y="737" class="detail"><tspan x="58" dy="0">문장·근거 기반 초안</tspan></text></g><g data-node="RAG"><rect x="470" y="670" width="300" height="160" rx="16" fill="#edf2fe" stroke="#4166a0" stroke-width="1.8"/><text x="488" y="701" class="title" fill="#4166a0"><tspan x="488" dy="0">권한 적용 지식 검색</tspan></text><text x="488" y="737" class="detail"><tspan x="488" dy="0">개정·영향·문서 버전</tspan></text></g><g data-node="AUD"><rect x="900" y="670" width="300" height="160" rx="16" fill="#edf2fe" stroke="#4166a0" stroke-width="1.8"/><text x="918" y="701" class="title" fill="#4166a0"><tspan x="918" dy="0">최소 감사·승인 기록</tspan></text><text x="918" y="737" class="detail"><tspan x="918" dy="0">권한·버전·수정·호출 이력</tspan></text></g><text x="40" y="975" font-size="17" fill="#425b6c">중앙·하단 구성은 기존 TS 로컬 서버의 논리 모듈이며 새 서버 수량을 뜻하지 않음</text><text x="40" y="1002" font-size="17" fill="#425b6c">NOA API·모델·사용권·현행 시스템 연계는 착수 시 확인 / 외부 모델 호출 없음</text><text x="40" y="1029" font-size="17" fill="#425b6c">반환 결과는 업무 화면에서 검토. 공식 접수·안전 판단·발행은 해당 권한자가 수행</text></svg>