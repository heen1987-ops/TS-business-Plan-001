<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1060" role="img" aria-labelledby="title desc"><title id="title">데이터 흐름 · 출처·권한·버전·승인</title><desc id="desc">E1 → P1：허용 자료。P1 → D1：검증·분리 결과。D1 → P2：원문·메타정보。P2 → P3：근거·규칙。P3 → P4：초안·불확실성。P4 → D2：검토된 결과。D2 → D3：승인·선택。D3 → D4：참조·행동。P2 → D4：검색·권한 기록</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8495"/></marker></defs><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}.title{font-size:22px;font-weight:700}.detail{font-size:18px;fill:#334d60}.edge{font-size:16px;fill:#435d70;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="52" font-size="28" font-weight="700" fill="#172e42">데이터 흐름 · 출처·권한·버전·승인</text><text x="40" y="88" font-size="18" fill="#587082">TS-P03-data · 제안 설계 · 운영 시스템 실측 전</text><polyline points="340,230 470,230" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="217" text-anchor="middle" class="edge"><tspan x="405" dy="0">허용 자료</tspan></text><polyline points="770,230 900,230" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="217" text-anchor="middle" class="edge"><tspan x="835" dy="0">검증·분리 결과</tspan></text><polyline points="1050,310 1050,410" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1065" y="360" text-anchor="start" class="edge"><tspan x="1065" dy="0">원문·메타정보</tspan></text><polyline points="900,490 770,490" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="477" text-anchor="middle" class="edge"><tspan x="835" dy="0">근거·규칙</tspan></text><polyline points="470,490 340,490" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="477" text-anchor="middle" class="edge"><tspan x="405" dy="0">초안·불확실성</tspan></text><polyline points="190,570 190,670" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="205" y="620" text-anchor="start" class="edge"><tspan x="205" dy="0">검토된 결과</tspan></text><polyline points="340,750 470,750" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="405" y="737" text-anchor="middle" class="edge"><tspan x="405" dy="0">승인·선택</tspan></text><polyline points="770,750 900,750" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="835" y="737" text-anchor="middle" class="edge"><tspan x="835" dy="0">참조·행동</tspan></text><polyline points="1050,570 1050,670" fill="none" stroke="#6d8495" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1065" y="620" text-anchor="start" class="edge"><tspan x="1065" dy="0">검색·권한 기록</tspan></text><g data-node="E1"><rect x="40" y="150" width="300" height="160" rx="16" fill="#edf1f5" stroke="#61768b" stroke-width="1.8"/><text x="58" y="181" class="title" fill="#61768b"><tspan x="58" dy="0">E1 승인된 원천</tspan></text><text x="58" y="217" class="detail"><tspan x="58" dy="0">계획·차량·물질·수신 기록</tspan></text></g><g data-node="P1"><rect x="470" y="150" width="300" height="160" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="488" y="181" class="title" fill="#087f72"><tspan x="488" dy="0">P1 반입·구조 검증</tspan></text><text x="488" y="217" class="detail"><tspan x="488" dy="0">대상키·기간·필수 항목</tspan></text></g><g data-node="D1"><rect x="900" y="150" width="300" height="160" rx="16" fill="#edf2fe" stroke="#4166a0" stroke-width="1.8"/><text x="918" y="181" class="title" fill="#4166a0"><tspan x="918" dy="0">D1 근거 자료</tspan></text><text x="918" y="217" class="detail"><tspan x="918" dy="0">운송건·문서 대응표</tspan></text></g><g data-node="P2"><rect x="900" y="410" width="300" height="160" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="918" y="441" class="title" fill="#087f72"><tspan x="918" dy="0">P2 근거·규칙 검색</tspan></text><text x="918" y="477" class="detail"><tspan x="918" dy="0">요청자 권한·적용일 필터</tspan></text></g><g data-node="P3"><rect x="470" y="410" width="300" height="160" rx="16" fill="#e7f5f2" stroke="#087f72" stroke-width="1.8"/><text x="488" y="441" class="title" fill="#087f72"><tspan x="488" dy="0">P3 로컬 LLM 구성</tspan></text><text x="488" y="477" class="detail"><tspan x="488" dy="0">출처 연결 초안·확인 질문</tspan></text></g><g data-node="P4"><rect x="40" y="410" width="300" height="160" rx="16" fill="#fff1d4" stroke="#946310" stroke-width="1.8"/><text x="58" y="441" class="title" fill="#946310"><tspan x="58" dy="0">P4 검토·수정</tspan></text><text x="58" y="477" class="detail"><tspan x="58" dy="0">계획·점검·인계가 일치?</tspan></text></g><g data-node="D2"><rect x="40" y="670" width="300" height="160" rx="16" fill="#edf2fe" stroke="#4166a0" stroke-width="1.8"/><text x="58" y="701" class="title" fill="#4166a0"><tspan x="58" dy="0">D2 검토 결과</tspan></text><text x="58" y="737" class="detail"><tspan x="58" dy="0">문서 상충·수신 누락</tspan></text></g><g data-node="D3"><rect x="470" y="670" width="300" height="160" rx="16" fill="#edf2fe" stroke="#4166a0" stroke-width="1.8"/><text x="488" y="701" class="title" fill="#4166a0"><tspan x="488" dy="0">D3 결정·처리 이력</tspan></text><text x="488" y="737" class="detail"><tspan x="488" dy="0">공식 상태·승인·정정 참조</tspan></text></g><g data-node="D4"><rect x="900" y="670" width="300" height="160" rx="16" fill="#edf2fe" stroke="#4166a0" stroke-width="1.8"/><text x="918" y="701" class="title" fill="#4166a0"><tspan x="918" dy="0">D4 최소 감사기록</tspan></text><text x="918" y="737" class="detail"><tspan x="918" dy="0">누가·언제·자료버전·행동</tspan></text></g><text x="40" y="975" font-size="17" fill="#425b6c">E: 외부 업무 원천 / P: 처리 / D: 논리 저장소 · 물리 DB 수량은 미정</text><text x="40" y="1002" font-size="17" fill="#425b6c">삭제·접근 철회 시 원문·인덱스·캐시·생성물 참조의 갱신·사용중지까지 전파</text><text x="40" y="1029" font-size="17" fill="#425b6c">원문·개인정보는 감사 로그에 반복 저장하지 않음 / 보존 기간은 자료 소유자와 확정</text></svg>