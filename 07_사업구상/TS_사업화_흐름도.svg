<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc"><title id="title">TS 신규 사업화 흐름도</title><desc id="desc">기간을 확정하지 않은 단계별 사업화 설계. 각 단계에서 근거가 부족하면 보완하거나 보류한다.</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1500" height="620" rx="0" fill="#f5f7fa" stroke="#f5f7fa"/><text x="45" y="54" font-size="31" fill="#152e42" font-weight="700">국민 문제 → TS의 역할 → 작은 AX 적용 → 효과 검증</text><text x="45" y="92" font-size="20" fill="#53667a" font-weight="400">한 문장으로 필요성을 설명하고 효과를 확인한 뒤 넓힙니다. 필요한 협의·심의는 해당 집행 전에 확인합니다.</text><path d="M 267 235 H 279 M 274 231 L 279 235 L 274 239" fill="none" stroke="#758b9f" stroke-width="1.5"/><rect x="42" y="141" width="221" height="236" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="60" y="179" font-size="27" fill="#176b6b" font-weight="700">01</text><text x="60" y="224" font-size="23" fill="#152e42" font-weight="700">국민의 한 장면</text><text x="60" y="268" font-size="18" fill="#405a6e" font-weight="400">누가 무엇이 불편한가</text><text x="60" y="296" font-size="18" fill="#405a6e" font-weight="400">왜 지금 해결할까</text><text x="60" y="348" font-size="16" fill="#53667a" font-weight="400">한 문장 WHY·증거</text><path d="M 509 235 H 521 M 516 231 L 521 235 L 516 239" fill="none" stroke="#758b9f" stroke-width="1.5"/><rect x="284" y="141" width="221" height="236" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="302" y="179" font-size="27" fill="#176b6b" font-weight="700">02</text><text x="302" y="224" font-size="23" fill="#152e42" font-weight="700">TS의 역할</text><text x="302" y="268" font-size="18" fill="#405a6e" font-weight="400">실제 업무·법적 근거</text><text x="302" y="296" font-size="18" fill="#405a6e" font-weight="400">현재 사업과의 경계</text><text x="302" y="348" font-size="16" fill="#53667a" font-weight="400">수행·비중복 확인</text><path d="M 751 235 H 763 M 758 231 L 763 235 L 758 239" fill="none" stroke="#758b9f" stroke-width="1.5"/><rect x="526" y="141" width="221" height="236" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="544" y="179" font-size="27" fill="#176b6b" font-weight="700">03</text><text x="544" y="224" font-size="23" fill="#152e42" font-weight="700">AI의 추가 효과</text><text x="544" y="268" font-size="18" fill="#405a6e" font-weight="400">어떤 행동이 달라질까</text><text x="544" y="296" font-size="18" fill="#405a6e" font-weight="400">규칙·비AI 대안 비교</text><text x="544" y="348" font-size="16" fill="#53667a" font-weight="400">AI 필요성·검증안</text><path d="M 993 235 H 1005 M 1000 231 L 1005 235 L 1000 239" fill="none" stroke="#758b9f" stroke-width="1.5"/><rect x="768" y="141" width="221" height="236" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="786" y="179" font-size="27" fill="#176b6b" font-weight="700">04</text><text x="786" y="224" font-size="23" fill="#152e42" font-weight="700">작은 적용</text><text x="786" y="268" font-size="18" fill="#405a6e" font-weight="400">기존 자산·한정 대상</text><text x="786" y="296" font-size="18" fill="#405a6e" font-weight="400">사람 검토·실패 복구</text><text x="786" y="348" font-size="16" fill="#53667a" font-weight="400">필요한 최소 정보화</text><path d="M 1235 235 H 1247 M 1242 231 L 1247 235 L 1242 239" fill="none" stroke="#758b9f" stroke-width="1.5"/><rect x="1010" y="141" width="221" height="236" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="1028" y="179" font-size="27" fill="#176b6b" font-weight="700">05</text><text x="1028" y="224" font-size="23" fill="#152e42" font-weight="700">국민 효과 검증</text><text x="1028" y="268" font-size="18" fill="#405a6e" font-weight="400">위험·불편·실패 변화</text><text x="1028" y="296" font-size="18" fill="#405a6e" font-weight="400">비용·권익·운영 부담</text><text x="1028" y="348" font-size="16" fill="#53667a" font-weight="400">효과·실행 가능성</text><rect x="1252" y="141" width="221" height="236" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="1270" y="179" font-size="27" fill="#176b6b" font-weight="700">06</text><text x="1270" y="224" font-size="23" fill="#152e42" font-weight="700">검증 후 확대</text><text x="1270" y="268" font-size="18" fill="#405a6e" font-weight="400">같은 문제에 반복 적용</text><text x="1270" y="296" font-size="18" fill="#405a6e" font-weight="400">기관별 업무·권한</text><text x="1270" y="348" font-size="16" fill="#53667a" font-weight="400">확산·사업화 판단</text><rect x="42" y="416" width="1431" height="153" rx="16" fill="#e9f1f1" stroke="#c8dedd"/><text x="68" y="454" font-size="23" fill="#152e42" font-weight="700">전 과정의 공통 확인</text><text x="68" y="493" font-size="23" fill="#152e42" font-weight="400">WHY·국민 성과  /  개인정보·안전·접근성  /  사람의 판단 책임  /  데이터 품질·출처·버전  /  비중복</text><text x="68" y="532" font-size="21" fill="#405a6e" font-weight="400">권한·데이터 또는 AI 추가 가치가 없으면 보완·보류  ·  기간·예산·정량 목표는 근거 확보 후 산정</text></g></svg>