<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title"><title id="title">서비스 컨셉도</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#326b72"/></marker></defs><style>text{font-family:'Malgun Gothic','맑은 고딕',sans-serif;fill:#173e4c;font-size:17px} .title{font-size:20px;font-weight:700}.small{font-size:15px}.label{font-size:15px;fill:#46636b}.white{fill:white}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="40" y="35" class="title">국민의 불편·위험 신호를 기획의 판단과 연결</text><rect x="40" y="65" width="210" height="112" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="58" y="95" class="title ">① 허용 자료</text><text x="58" y="123" class="">민원·정책·뉴스</text><text x="58" y="147" class="">내부 현황·업무자료</text><path d="M250 121H302" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><rect x="310" y="65" width="210" height="112" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="328" y="95" class="title ">② 근거 검토</text><text x="328" y="123" class="">원문·시점·대표성</text><text x="328" y="147" class="">상충 의견·추가 조사</text><path d="M520 121H572" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><rect x="580" y="65" width="210" height="112" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="598" y="95" class="title ">③ 문제정의</text><text x="598" y="123" class="">현상과 원인 가설</text><text x="598" y="147" class="">TS 역할·기구축 범위</text><path d="M790 121H842" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><rect x="850" y="65" width="210" height="112" rx="8" fill="#e5f3ee" stroke="#499684" stroke-width="1.5" /><text x="868" y="95" class="title ">④ 대안 선택</text><text x="868" y="123" class="">운영·제도·SI·AX</text><text x="868" y="147" class="">선택·제외 이유</text><path d="M955 177V230H555V255" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><text x="720" y="219" class="label">담당자가 검토한 결과</text><rect x="100" y="260" width="960" height="112" rx="8" fill="#173e4c" stroke="#173e4c" stroke-width="1.5" /><text x="118" y="290" class="title white">공통 사업원장</text><text x="118" y="318" class="white">문제·근거·선정 이유 → 사업범위·성과·비용·요구사항</text><text x="118" y="342" class="white">검토 결정과 버전을 같은 기준으로 관리</text><path d="M580 372V403H240V432" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><path d="M580 372V432" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><path d="M580 403H910V432" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><rect x="100" y="438" width="280" height="105" rx="8" fill="#e5f3ee" stroke="#499684" stroke-width="1.5" /><text x="118" y="468" class="title ">정책검토 초안</text><text x="118" y="496" class="">문제와 대안의 타당성</text><rect x="440" y="438" width="280" height="105" rx="8" fill="#e5f3ee" stroke="#499684" stroke-width="1.5" /><text x="458" y="468" class="title ">예산요구 초안</text><text x="458" y="496" class="">범위·산출근거·성과</text><rect x="780" y="438" width="280" height="105" rx="8" fill="#e5f3ee" stroke="#499684" stroke-width="1.5" /><text x="798" y="468" class="title ">발주 준비 초안</text><text x="798" y="496" class="">RFP·공고 인계 자료</text><path d="M240 543V585" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><path d="M580 543V585" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><path d="M920 543V585" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><rect x="100" y="590" width="960" height="78" rx="8" fill="#fcf1e4" stroke="#bc8953" stroke-width="1.5" /><text x="118" y="620" class="title ">사람의 검토 → 기존 공식 업무절차</text><text x="118" y="648" class="">정책·예산·계약·공개 판단은 기관에서 수행</text><path d="M100 630H60V720H1020" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="145" y="710" class="label">공식 처리결과·실행 성과를 등록하여 원장과 차기 기획에 반영</text><path d="M1020 720H1080V240H1060V260" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="100" y="755" class="label">실선: 자료·초안의 연결   /   점선: 실제 결과와 성과의 환류</text></svg>