<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-labelledby="title"><title id="title">데이터 흐름도</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#326b72"/></marker></defs><style>text{font-family:'Malgun Gothic','맑은 고딕',sans-serif;fill:#173e4c;font-size:17px} .title{font-size:20px;font-weight:700}.small{font-size:15px}.label{font-size:15px;fill:#46636b}.white{fill:white}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="40" y="35" class="title">출처 → 근거 → 검토 판단 → 사업·비용 → 문서의 추적 관계</text><rect x="70" y="75" width="430" height="107" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="88" y="105" class="title ">① 자료원장</text><text x="88" y="133" class="">원문·발행일·수집일</text><text x="88" y="157" class="">사용범위·접근권한</text><path d="M280 182V202" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><rect x="70" y="210" width="430" height="107" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="88" y="240" class="title ">② 근거 단위</text><text x="88" y="268" class="">원문 구간·인용 위치</text><text x="88" y="292" class="">사실·가설·상충 근거</text><path d="M280 317V337" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><rect x="70" y="345" width="430" height="107" rx="8" fill="#173e4c" stroke="#173e4c" stroke-width="1.5" /><text x="88" y="375" class="title white">③ 검토한 사업버전</text><text x="88" y="403" class="white">소관·선정 이유·범위</text><text x="88" y="427" class="white">성과·조건·검토 결정</text><path d="M280 452V472" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><rect x="70" y="480" width="430" height="107" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="88" y="510" class="title ">④ 비용·요구 버전</text><text x="88" y="538" class="">공수·단가·연차</text><text x="88" y="562" class="">요구사항 ↔ 검수</text><path d="M280 587V607" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><rect x="70" y="615" width="430" height="107" rx="8" fill="#fff" stroke="#aebfc3" stroke-width="1.5" /><text x="88" y="645" class="title ">⑤ 문서버전</text><text x="88" y="673" class="">사업·양식 버전 참조</text><text x="88" y="697" class="">내부본·공개 검토본</text><rect x="625" y="95" width="410" height="112" rx="8" fill="#e5f3ee" stroke="#499684" stroke-width="1.5" /><text x="643" y="125" class="title ">검색·생성의 처리 경로</text><text x="643" y="153" class="">사용자 권한 → 허용 근거 검색</text><text x="643" y="177" class="">근거 + 질의 → 로컬 LLM</text><path d="M500 250H590V160H617" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><text x="518" y="239" class="label">근거</text><path d="M825 207V265H555V385H508" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><text x="648" y="249" class="label">초안·인용 → 사람 검토</text><rect x="625" y="350" width="410" height="112" rx="8" fill="#fcf1e4" stroke="#bc8953" stroke-width="1.5" /><text x="643" y="380" class="title ">변경 영향 추적</text><text x="643" y="408" class="">정정·철회 → 관련 주장·문서 찾기</text><text x="643" y="432" class="">재검토 표시 → 판단 후 새 버전</text><path d="M500 130H550V320H825V342" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="670" y="308" class="label">원문 변경</text><path d="M625 395H560V430H508" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M825 462V575H540V665H508" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="665" y="560" class="label">영향 문서 재검토</text><rect x="625" y="665" width="410" height="105" rx="8" fill="#e5f3ee" stroke="#499684" stroke-width="1.5" /><text x="643" y="695" class="title ">양식 프로필</text><text x="643" y="723" class="">연도·수신자·필수 필드</text><text x="643" y="747" class="">제공 고정 양식·공개 구분</text><path d="M625 715H508" fill="none" stroke="#326b72" stroke-width="2" marker-end="url(#arrow)" /><text x="545" y="701" class="label">매핑</text><rect x="70" y="795" width="965" height="75" rx="8" fill="#173e4c" stroke="#173e4c" stroke-width="1.5" /><text x="88" y="825" class="title white">공통 통제: 원문·파생자료 권한 + 변경·검토·공개 이력</text><text x="88" y="853" class="white">검색 제한과 별도로 문서 공개를 검토하며 이전 버전은 보존합니다.</text></svg>