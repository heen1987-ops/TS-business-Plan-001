<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title desc"><title id="title">국민체감형 TS AX 마인드맵</title><desc id="desc">기존 5건의 국민 체감·TS 역할·AI 추가 가치 재검토. 구체화 검토 2건, 수행 근거 선확인 1건, 문제 또는 AI 재검토 2건. 선정 확정 아님.</desc><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1500" height="1100" rx="0" fill="#f5f7fa" stroke="#f5f7fa"/><text x="48" y="55" font-size="32" fill="#152e42" font-weight="700">국민체감형 TS AX — 왜 해야 하는가?</text><text x="48" y="92" font-size="19" fill="#53667a" font-weight="400">국민의 불편·위험 → TS의 역할 → AI의 추가 효과  ·  기존 5건 재검토 / 선정 0건  ·  2026.09.09</text><path d="M 568 565 C 480 565, 470 241, 426 241" fill="none" stroke="#b8c5d0" stroke-width="2"/><path d="M 568 565 C 480 565, 470 493, 426 493" fill="none" stroke="#b8c5d0" stroke-width="2"/><path d="M 568 565 C 480 565, 470 795, 426 795" fill="none" stroke="#b8c5d0" stroke-width="2"/><path d="M 794 565 C 830 565, 830 214, 872 214" fill="none" stroke="#b8c5d0" stroke-width="2"/><path d="M 794 565 C 830 565, 830 378, 872 378" fill="none" stroke="#b8c5d0" stroke-width="2"/><path d="M 794 565 C 830 565, 830 542, 872 542" fill="none" stroke="#b8c5d0" stroke-width="2"/><path d="M 794 565 C 830 565, 830 706, 872 706" fill="none" stroke="#b8c5d0" stroke-width="2"/><path d="M 794 565 C 830 565, 830 870, 872 870" fill="none" stroke="#b8c5d0" stroke-width="2"/><rect x="475" y="485" width="322" height="166" rx="22" fill="#183c50" stroke="#183c50"/><text x="502" y="523" font-size="23" fill="#dcebf3" font-weight="400">국민이 체감하는</text><text x="502" y="565" font-size="30" fill="#ffffff" font-weight="700">TS AX 솔루션</text><text x="502" y="607" font-size="27" fill="#ffffff" font-weight="700">왜 필요한가?</text><rect x="42" y="145" width="385" height="192" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="66" y="185" font-size="24" fill="#152e42" font-weight="700">01  한 문장 WHY</text><text x="66" y="227" font-size="21" fill="#405a6e" font-weight="400">국민의 불편·위험 한 장면</text><text x="66" y="258" font-size="21" fill="#405a6e" font-weight="400">TS의 실제 업무·법적 역할</text><text x="66" y="289" font-size="21" fill="#405a6e" font-weight="400">AI로 달라질 국민의 경험</text><rect x="42" y="373" width="385" height="240" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="66" y="413" font-size="24" fill="#152e42" font-weight="700">02  작게 적용·효과 확인</text><text x="66" y="455" font-size="21" fill="#405a6e" font-weight="400">기존 업무·자산에서 작은 검증</text><text x="66" y="486" font-size="21" fill="#405a6e" font-weight="400">비AI 대비 추가 효과</text><text x="66" y="517" font-size="21" fill="#405a6e" font-weight="400">국민 시간·실패·위험의 변화</text><text x="66" y="548" font-size="21" fill="#405a6e" font-weight="400">운영 비용·현업 부담도 확인</text><rect x="42" y="681" width="385" height="228" rx="16" fill="#ffffff" stroke="#d9e2e9"/><text x="66" y="721" font-size="24" fill="#152e42" font-weight="700">03  효과의 파급</text><text x="66" y="763" font-size="21" fill="#405a6e" font-weight="400">같은 문제가 반복되는 국민</text><text x="66" y="794" font-size="21" fill="#405a6e" font-weight="400">사업자·지역으로 재적용</text><text x="66" y="825" font-size="21" fill="#405a6e" font-weight="400">기관별 업무·권한 확인</text><text x="66" y="856" font-size="21" fill="#405a6e" font-weight="400">효과 없으면 보류·문제 재정의</text><rect x="873" y="145" width="582" height="145" rx="16" fill="#ffffff" stroke="#d9e2e9"/><rect x="873" y="165" width="5" height="105" rx="2" fill="#176b6b"/><text x="897" y="174" font-size="17" fill="#176b6b" font-weight="700">TS-BIZ-002  ·  구체화 검토</text><text x="897" y="210" font-size="24" fill="#152e42" font-weight="700">사업용차 반복위험 예방</text><text x="897" y="246" font-size="20" fill="#152e42" font-weight="400">반복 위험운행을 줄여 승객·보행자 보호</text><text x="897" y="273" font-size="16" fill="#53667a" font-weight="400">해결·효과 가설 / 수행 근거·비중복 확인 필요</text><rect x="873" y="309" width="582" height="145" rx="16" fill="#ffffff" stroke="#d9e2e9"/><rect x="873" y="329" width="5" height="105" rx="2" fill="#395e9d"/><text x="897" y="338" font-size="17" fill="#395e9d" font-weight="700">TS-BIZ-004  ·  수행 근거 선확인</text><text x="897" y="374" font-size="24" fill="#152e42" font-weight="700">교통약자 헛걸음 예방</text><text x="897" y="410" font-size="20" fill="#152e42" font-weight="400">갈 수 있다고 믿고 나섰다 막히는 이동 예방</text><text x="897" y="437" font-size="16" fill="#53667a" font-weight="400">해결·효과 가설 / 수행 근거·비중복 확인 필요</text><rect x="873" y="473" width="582" height="145" rx="16" fill="#ffffff" stroke="#d9e2e9"/><rect x="873" y="493" width="5" height="105" rx="2" fill="#395e9d"/><text x="897" y="502" font-size="17" fill="#395e9d" font-weight="700">TS-BIZ-005  ·  구체화 검토</text><text x="897" y="538" font-size="24" fill="#152e42" font-weight="700">기계식주차장 위험 조기확인</text><text x="897" y="574" font-size="20" fill="#152e42" font-weight="400">위험 신호를 먼저 확인해 점검·보수 연결</text><text x="897" y="601" font-size="16" fill="#53667a" font-weight="400">해결·효과 가설 / 수행 근거·비중복 확인 필요</text><rect x="873" y="637" width="582" height="145" rx="16" fill="#ffffff" stroke="#d9e2e9"/><rect x="873" y="657" width="5" height="105" rx="2" fill="#176b6b"/><text x="897" y="666" font-size="17" fill="#176b6b" font-weight="700">TS-BIZ-006  ·  문제 재발굴</text><text x="897" y="702" font-size="24" fill="#152e42" font-weight="700">철도 안전증빙 — 문제 재발굴</text><text x="897" y="738" font-size="20" fill="#152e42" font-weight="400">문서 효율화에서 국민 안전 문제를 다시 찾기</text><text x="897" y="765" font-size="16" fill="#53667a" font-weight="400">해결·효과 가설 / 수행 근거·비중복 확인 필요</text><rect x="873" y="801" width="582" height="145" rx="16" fill="#ffffff" stroke="#d9e2e9"/><rect x="873" y="821" width="5" height="105" rx="2" fill="#395e9d"/><text x="897" y="830" font-size="17" fill="#395e9d" font-weight="700">TS-BIZ-007  ·  AI 필요성 재검토</text><text x="897" y="866" font-size="24" fill="#152e42" font-weight="700">위험물 사고대응 — AI 재검토</text><text x="897" y="902" font-size="20" fill="#152e42" font-weight="400">현장에 필요한 위험물 정보를 제때 전달</text><text x="897" y="929" font-size="16" fill="#53667a" font-weight="400">해결·효과 가설 / 수행 근거·비중복 확인 필요</text><rect x="42" y="959" width="1413" height="100" rx="16" fill="#edf1f5" stroke="#d9e2e9"/><text x="65" y="995" font-size="21" fill="#152e42" font-weight="700">범위 이력  |  001 공시 확장(제외) · 003 튜닝 안내(유보) · 008 드론 안내(유보)</text><text x="65" y="1030" font-size="19" fill="#53667a" font-weight="400">작은 적용으로 국민 효과 검증  /  필요한 최소 정보화만 설계  /  비중복·수행 권한·예산·일정 미확정</text></g></svg>